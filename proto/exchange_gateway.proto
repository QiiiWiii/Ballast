syntax = "proto3";

package ballast.gateway.v1;

service MarketDataService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (ExchangeCapabilities);
  rpc GetOrderBook(GetOrderBookRequest) returns (OrderBook);
  rpc FetchHistoricalBatch(FetchHistoricalBatchRequest) returns (FetchHistoricalBatchResponse);
  rpc WatchOrderBook(WatchMarketRequest) returns (stream OrderBookStreamEvent);
  rpc WatchTrades(WatchMarketRequest) returns (stream TradeStreamEvent);
}

enum HistoricalDataType {
  HISTORICAL_DATA_TYPE_UNSPECIFIED = 0;
  HISTORICAL_DATA_TYPE_OHLCV = 1;
  HISTORICAL_DATA_TYPE_TRADES = 2;
}

enum Exchange {
  EXCHANGE_UNSPECIFIED = 0;
  EXCHANGE_BINANCE = 1;
  EXCHANGE_OKX = 2;
  EXCHANGE_BYBIT = 3;
  EXCHANGE_GATE_IO = 4;
  EXCHANGE_BITGET = 5;
}

enum MarketKind {
  MARKET_KIND_UNSPECIFIED = 0;
  MARKET_KIND_SPOT = 1;
  MARKET_KIND_PERPETUAL = 2;
}

enum ContractKind {
  CONTRACT_KIND_UNSPECIFIED = 0;
  CONTRACT_KIND_LINEAR = 1;
  CONTRACT_KIND_INVERSE = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum StreamState {
  STREAM_STATE_UNSPECIFIED = 0;
  STREAM_STATE_CONNECTING = 1;
  STREAM_STATE_CONNECTED = 2;
  STREAM_STATE_RECONNECTING = 3;
  STREAM_STATE_STALE = 4;
  STREAM_STATE_CLOSED = 5;
}

message HealthRequest {}

message AdapterHealth {
  Exchange exchange = 1;
  string status = 2;
  optional string last_error_code = 3;
  optional int64 last_success_at_ms = 4;
}

message HealthResponse {
  string status = 1;
  string service_version = 2;
  int64 gateway_time_ms = 3;
  repeated AdapterHealth adapters = 4;
}

message InstrumentKey {
  Exchange exchange = 1;
  MarketKind market_kind = 2;
  string symbol = 3;
}

message ListInstrumentsRequest {
  Exchange exchange = 1;
  MarketKind market_kind = 2;
  ContractKind contract_kind = 3;
  bool active_only = 4;
  bool reload = 5;
}

message Instrument {
  InstrumentKey key = 1;
  string exchange_symbol = 2;
  string base_asset = 3;
  string quote_asset = 4;
  optional string settle_asset = 5;
  ContractKind contract_kind = 6;
  optional string contract_size = 7;
  string price_tick = 8;
  string quantity_step = 9;
  optional string minimum_quantity = 10;
  optional string minimum_notional = 11;
  optional string maker_fee_rate = 12;
  optional string taker_fee_rate = 13;
  bool active = 14;
}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
  int64 observed_at_ms = 2;
}

message GetCapabilitiesRequest {
  Exchange exchange = 1;
}

message ExchangeCapabilities {
  Exchange exchange = 1;
  bool spot = 2;
  bool perpetual_linear = 3;
  bool perpetual_inverse = 4;
  bool fetch_order_book = 5;
  bool watch_order_book = 6;
  bool watch_trades = 7;
  bool fetch_ohlcv = 8;
  bool fetch_trades = 9;
}

message GetOrderBookRequest {
  InstrumentKey instrument = 1;
  uint32 depth = 2;
}

message FetchHistoricalBatchRequest {
  InstrumentKey instrument = 1;
  HistoricalDataType data_type = 2;
  optional string timeframe = 3;
  int64 cursor_ms = 4;
  int64 end_ms = 5;
  uint32 limit = 6;
}

message HistoricalCandle {
  int64 open_time_ms = 1;
  string open = 2;
  string high = 3;
  string low = 4;
  string close = 5;
  string volume = 6;
}

message HistoricalTrade {
  string exchange_trade_id = 1;
  int64 trade_time_ms = 2;
  string price = 3;
  string quantity = 4;
  string taker_side = 5;
}

message FetchHistoricalBatchResponse {
  repeated HistoricalCandle candles = 1;
  repeated HistoricalTrade trades = 2;
  int64 next_cursor_ms = 3;
  bool exhausted = 4;
  int64 observed_at_ms = 5;
}

message WatchMarketRequest {
  InstrumentKey instrument = 1;
  uint32 depth = 2;
}

message BookLevel {
  string price = 1;
  string quantity = 2;
}

message OrderBook {
  InstrumentKey instrument = 1;
  repeated BookLevel bids = 2;
  repeated BookLevel asks = 3;
  int64 exchange_time_ms = 4;
  int64 gateway_received_at_ms = 5;
  optional string sequence = 6;
}

message Trade {
  string event_id = 1;
  InstrumentKey instrument = 2;
  string exchange_trade_id = 3;
  string price = 4;
  string quantity = 5;
  Side taker_side = 6;
  int64 exchange_time_ms = 7;
  int64 gateway_received_at_ms = 8;
}

message StreamStatus {
  StreamState state = 1;
  int64 gateway_time_ms = 2;
  uint32 reconnect_attempt = 3;
  optional string error_code = 4;
}

message OrderBookStreamEvent {
  oneof payload {
    StreamStatus status = 1;
    OrderBook order_book = 2;
  }
}

message TradeStreamEvent {
  oneof payload {
    StreamStatus status = 1;
    Trade trade = 2;
  }
}
