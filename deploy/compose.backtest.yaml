x-backtest-common: &backtest-common
  build:
    context: ..
    dockerfile: deploy/backtest.Dockerfile
  image: ${BALLAST_IMAGE_NAMESPACE:-sevenold}/ballast-backtest:${BALLAST_IMAGE_TAG:-latest}
  environment:
    BACKTEST_API_BASE: ${BACKTEST_API_BASE:-http://server:8080}
    BACKTEST_BEARER_TOKEN: ${BACKTEST_BEARER_TOKEN:-}
    BACKTEST_START_AT: ${BACKTEST_START_AT:-}
    BACKTEST_END_AT: ${BACKTEST_END_AT:-}
    BACKTEST_EXCHANGE: ${BACKTEST_EXCHANGE:-okx}
    BACKTEST_EXCHANGES: ${BACKTEST_EXCHANGES:-okx,binance,bybit,gate_io,bitget}
    BACKTEST_MARKET_KIND: ${BACKTEST_MARKET_KIND:-spot}
    BACKTEST_SYMBOL: ${BACKTEST_SYMBOL:-BTC/USDT}
    BACKTEST_DATA_TYPE: ${BACKTEST_DATA_TYPE:-trades}
    BACKTEST_TIMEFRAME: ${BACKTEST_TIMEFRAME:-1m}
    BACKTEST_TARGET_AMOUNT: ${BACKTEST_TARGET_AMOUNT:-1}
    BACKTEST_STRATEGY: ${BACKTEST_STRATEGY:-twap}
    BACKTEST_STRATEGIES: ${BACKTEST_STRATEGIES:-twap,pov}
    BACKTEST_MATRIX_JSON: ${BACKTEST_MATRIX_JSON:-}
    BACKTEST_MATRIX_POV_RATE: ${BACKTEST_MATRIX_POV_RATE:-0.05}
    BACKTEST_QUANTITY_UNIT: ${BACKTEST_QUANTITY_UNIT:-base_quantity}
    BACKTEST_SIDE: ${BACKTEST_SIDE:-buy}
    BACKTEST_TICK_INTERVAL_SECONDS: ${BACKTEST_TICK_INTERVAL_SECONDS:-60}
    BACKTEST_MAX_SLIPPAGE_BPS: ${BACKTEST_MAX_SLIPPAGE_BPS:-100}
    BACKTEST_PARTICIPATION_RATE: ${BACKTEST_PARTICIPATION_RATE:-}
    BACKTEST_PAGE_LIMIT: ${BACKTEST_PAGE_LIMIT:-500}
    BACKTEST_MAX_PAGES: ${BACKTEST_MAX_PAGES:-25}
    BACKTEST_MAX_ROWS: ${BACKTEST_MAX_ROWS:-100000}
    BACKTEST_POLL_INTERVAL_MS: ${BACKTEST_POLL_INTERVAL_MS:-1000}
    BACKTEST_BACKFILL_TIMEOUT_SECONDS: ${BACKTEST_BACKFILL_TIMEOUT_SECONDS:-900}
    BACKTEST_REQUEST_TIMEOUT_MS: ${BACKTEST_REQUEST_TIMEOUT_MS:-30000}
    BACKTEST_IDEMPOTENCY_KEY: ${BACKTEST_IDEMPOTENCY_KEY:-}
  depends_on:
    server:
      condition: service_healthy
  networks: [ballast-private]

services:
  backtest:
    <<: *backtest-common

  backtest-matrix:
    <<: *backtest-common
    entrypoint: ["node", "/opt/ballast/backtest-matrix.mjs"]
