name: Docker Publish

# Images ship with releases (git tags v*).
# Tag policy:
#   v1.2.3  -> 1.2.3, 1.2, 1 (if major>=1), v1.2.3, latest, sha-<short>
#   workflow_dispatch on main -> main, sha-<short> (no latest)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/server.Dockerfile
            image: ballast-server
          - name: gateway
            dockerfile: deploy/gateway.Dockerfile
            image: ballast-gateway
          - name: web
            dockerfile: deploy/web.Dockerfile
            image: ballast-web
    steps:
      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN before publishing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            # Formal release: version numbers + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            # Immutable build id (every publish)
            type=sha,prefix=sha-,format=short
            # Manual main builds only (workflow_dispatch), never latest
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Ballast ${{ matrix.name }} image
            org.opencontainers.image.source=https://github.com/QiiiWiii/Ballast

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}-multi
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-multi
          platforms: linux/amd64,linux/arm64
          provenance: false

      - name: Publish tag summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "platforms: \`linux/amd64\`, \`linux/arm64\`"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo ""
              echo "release track: version tags + \`latest\`"
            else
              echo ""
              echo "dev track: no \`latest\` (only \`main\` / \`sha-*\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
