name: ballast

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ballast
      POSTGRES_USER: ballast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ballast-local-only}
    volumes:
      - ballast-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballast -d ballast"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [ballast-private]

  gateway:
    image: ${BALLAST_IMAGE_NAMESPACE:-sevenold}/ballast-gateway:${BALLAST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    environment:
      BALLAST_GATEWAY_BIND: 0.0.0.0:50051
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXCHANGE_TIMEOUT_MS: ${EXCHANGE_TIMEOUT_MS:-15000}
      STREAM_STALE_AFTER_MS: ${STREAM_STALE_AFTER_MS:-30000}
    restart: unless-stopped
    networks: [ballast-private]

  server:
    image: ${BALLAST_IMAGE_NAMESPACE:-sevenold}/ballast-server:${BALLAST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    environment:
      BALLAST_SERVER_BIND: 0.0.0.0:8080
      BALLAST_GATEWAY_ENDPOINT: http://gateway:50051
      BALLAST_CORS_ORIGIN: ${BALLAST_PUBLIC_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgres://ballast:${POSTGRES_PASSWORD:-ballast-local-only}@postgres:5432/ballast
      RUST_LOG: ${RUST_LOG:-ballast_server=info,tower_http=info}
      BALLAST_LIVE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: unless-stopped
    networks: [ballast-private]

  web:
    image: ${BALLAST_IMAGE_NAMESPACE:-sevenold}/ballast-web:${BALLAST_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${BALLAST_WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
    networks: [ballast-private]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ballast-prometheus:/prometheus
    restart: unless-stopped
    networks: [ballast-private]

  backup:
    image: postgres:17-bookworm
    environment:
      DATABASE_URL: postgres://ballast:${POSTGRES_PASSWORD:-ballast-local-only}@postgres:5432/ballast
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command: ["sh", "/opt/ballast/backup.sh"]
    volumes:
      - ./backup.sh:/opt/ballast/backup.sh:ro
      - ballast-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [ballast-private]

networks:
  ballast-private:
    internal: false

volumes:
  ballast-postgres:
  ballast-prometheus:
  ballast-backups:
